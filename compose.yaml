# Runs behind a reverse proxy on an existing Docker network. Everything
# deployment-specific (data directory, network, credentials) comes from the
# environment the stack is deployed with; nothing host-specific lives here.
services:
  mozi:
    build: .
    image: mozi:local
    container_name: mozi
    restart: unless-stopped
    ports:
      - '3010:3000'
    environment:
      - TZ=Europe/Budapest
      # Cloudflare sets the real client address; nginx passes it through.
      - ADDRESS_HEADER=cf-connecting-ip
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - TMDB_TOKEN=${TMDB_TOKEN}
      - RADARR_URL=${RADARR_URL}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - RADARR_QUALITY_PROFILE_ID=${RADARR_QUALITY_PROFILE_ID}
      - PLEX_URL=${PLEX_URL}
      - PLEX_TOKEN=${PLEX_TOKEN}
    volumes:
      # Absolute host path, owned by uid 1000 (the image's `node` user).
      - ${MOZI_DATA_DIR:?set MOZI_DATA_DIR}:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  frontend:
    # The reverse proxy's network; created by the proxy's own stack.
    name: ${MOZI_NETWORK:?set MOZI_NETWORK}
    external: true
